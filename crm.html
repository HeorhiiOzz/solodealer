<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoloDealer CRM</title><style>:root{--bg:#050505;--panel:#0d0d10;--line:#292932;--text:#f7f7f9;--muted:#8d8d98;--grad:linear-gradient(110deg,#8c42df,#bd5acd 48%,#ff8b90)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.wrap{width:min(1220px,calc(100% - 28px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.92);backdrop-filter:blur(14px);border-bottom:1px solid #222}.top .wrap{height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:20px}.brand b{background:var(--grad);-webkit-background-clip:text;color:transparent}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--grad);color:#fff}.secondary{border:1px solid #333;background:#111;color:#fff}.danger{border:1px solid #562d37;background:#180e11;color:#ffc1ca}.hidden{display:none!important}.login{width:min(450px,calc(100% - 28px));margin:70px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}.stack{display:grid;gap:10px}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#0e0e12;color:#eee}.fieldgroup{display:grid;gap:6px}.fieldlabel{font-size:12px;font-weight:850;color:#c7c7cf}.reminderbox{padding:10px;border:1px solid #53365f;border-radius:14px;background:linear-gradient(110deg,rgba(140,66,223,.12),rgba(255,139,144,.06))}.reminderhint{font-size:12px;color:#bba9c4;line-height:1.45}.crm{padding:30px 0 60px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.head h1{font-size:36px;margin:0}.head p{color:var(--muted);margin:8px 0 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px}.stat small{display:block;color:var(--muted);margin-bottom:7px}.stat b{font-size:25px}.filters{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:10px}.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.datebar .secondary.active{border-color:#9b4eb4;background:linear-gradient(110deg,rgba(140,66,223,.22),rgba(255,139,144,.12))}.datebar input{width:auto;min-width:170px}.shown{color:#92929c;font-size:13px;margin-left:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.list{display:grid;gap:10px}.client{border:1px solid #292932;border-radius:16px;padding:15px;display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:12px;align-items:center;background:#0a0a0d}.client.overdue{border-color:#6b3440;box-shadow:inset 3px 0 0 #ff7185}.name{font-size:17px;font-weight:900}.meta{color:#92929c;font-size:13px;line-height:1.5;margin-top:5px}.tag{display:inline-block;padding:6px 9px;border:1px solid #34343d;border-radius:999px;font-size:12px;color:#c4c4ca;background:#111116}.created{display:inline-block;margin-top:7px;color:#c9a9d7;font-size:12px}.due{font-size:13px}.due.bad{color:#ff9baa;font-weight:800}.due.good{color:#9fe0b8}.notice{padding:12px 14px;border:1px solid #3b2e46;border-radius:12px;color:#cab9d4;background:#100d13}.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.modalbox{width:min(720px,100%);max-height:94vh;overflow:auto;background:#111115;border:1px solid #34343d;border-radius:22px;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.close{border:0;background:transparent;color:#aaa;font-size:28px;cursor:pointer}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.history{margin-top:16px;border-top:1px solid #292932;padding-top:14px}.history-item{padding:9px 0;border-bottom:1px solid #202026;color:#aaa;font-size:13px}.empty{text-align:center;color:#777;padding:45px 10px}.savehint{font-size:12px;color:#777}.flash{position:fixed;right:18px;bottom:18px;padding:12px 16px;border-radius:12px;background:#151119;border:1px solid #4b3655;display:none;z-index:80}@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.filters,.client,.row3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.head{align-items:start;flex-direction:column}.stats,.filters,.client,.row2,.row3{grid-template-columns:1fr}.top .wrap{height:auto;padding:12px 0;align-items:flex-start}.actions{justify-content:flex-end}.shown{width:100%;margin-left:0}.datebar input{width:100%}}</style></head><body><div class="top"><div class="wrap"><div class="brand"><b>SOLO</b>Dealer CRM</div><div class="actions"><a class="secondary" href="/admin">Авто</a><a class="secondary" href="/">Сайт</a><button id="logoutBtn" class="secondary hidden" onclick="logout()">Вийти</button></div></div></div><div id="loginBox" class="login"><h2>Вхід у CRM</h2><div class="stack"><input id="password" class="field" type="password" placeholder="Пароль"><button class="primary" onclick="login()">Увійти</button><div id="loginMsg"></div></div></div><main id="main" class="crm hidden"><div class="wrap"><div class="head"><div><h1>Клієнти</h1><p>Воронка, наступний контакт і вся історія клієнта в одному місці.</p></div><button class="primary" onclick="newClient()">+ Додати клієнта</button></div><div class="stats"><div class="stat"><small>Всього</small><b id="sTotal">0</b></div><div class="stat"><small>Нові</small><b id="sNew">0</b></div><div class="stat"><small>В роботі</small><b id="sActive">0</b></div><div class="stat"><small>Треба зв’язатись</small><b id="sDue">0</b></div><div class="stat"><small>Угоди</small><b id="sDeals">0</b></div></div><div class="filters"><input id="search" class="field" placeholder="Ім’я, телефон, авто..." oninput="render()"><select id="statusFilter" class="field" onchange="render()"><option value="">Усі етапи</option></select><select id="sourceFilter" class="field" onchange="render()"><option value="">Усі джерела</option></select><select id="dateFilter" class="field" onchange="dateChanged()"><option value="all">Усі дні</option><option value="today">Сьогодні</option><option value="yesterday">Вчора</option><option value="7d">Останні 7 днів</option><option value="30d">Останні 30 днів</option><option value="custom">Обрати дату</option></select><button id="dueBtn" class="secondary" onclick="showDue()">Треба зв’язатись</button></div><div class="datebar"><button class="secondary" data-day="today" onclick="quickDay('today',this)">Сьогодні</button><button class="secondary" data-day="yesterday" onclick="quickDay('yesterday',this)">Вчора</button><button class="secondary" data-day="7d" onclick="quickDay('7d',this)">7 днів</button><input id="customDate" class="field hidden" type="date" onchange="render()"><span id="shown" class="shown"></span></div><div class="panel"><div id="list" class="list"></div></div></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2 id="formTitle" style="margin:0">Картка клієнта</h2><button class="close" onclick="closeModal()">×</button></div><form id="form" class="stack"><input type="hidden" name="id"><div class="row2"><input class="field" name="name" required placeholder="Ім’я"><input class="field" name="contact" required placeholder="Телефон / Telegram"></div><div class="row3"><select class="field" name="source"><option>Сайт</option><option>TikTok</option><option>Instagram</option><option>Telegram</option><option>Анкета</option><option>Рекомендація</option><option>Інше</option></select><select class="field" name="status"></select><select class="field" name="payment_type"><option value="">Форма оплати</option><option>Кредит</option><option>Під виплату</option><option>Готівка</option></select></div><div class="row2"><input class="field" name="car_name" placeholder="Яке авто цікавить"><input class="field" name="budget" placeholder="Бюджет, напр. $15 000"></div><div class="row2"><div class="fieldgroup"><label class="fieldlabel">Перший внесок</label><input class="field" name="first_payment" placeholder="Напр. $500"></div><div class="reminderbox"><div class="fieldgroup"><label class="fieldlabel">⏰ Наступний контакт</label><input class="field" name="next_contact" type="datetime-local"><div class="reminderhint">Постав дату й час — SoloDealer нагадає тобі в Telegram.</div></div></div></div><textarea class="field" name="notes" rows="6" placeholder="Коментарі, домовленості, що важливо пам’ятати"></textarea><div class="actions"><button class="primary">Зберегти</button><button class="secondary" type="button" onclick="closeModal()">Скасувати</button><button id="deleteBtn" class="danger" type="button" onclick="deleteClient()">Видалити</button></div><div class="savehint">Зміни зберігаються у CRM SoloDealer.</div></form><div id="history" class="history"></div></div></div><div id="flash" class="flash"></div><script>const stages={new:'Новий',contacted:'Зв’язались',selection:'Підбір авто',viewing:'Перегляд',documents:'Документи',deal:'Угода',lost:'Втрачений'};let clients=[],pass=sessionStorage.getItem('solo_pass')||'',editingId='',dueOnly=false;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const now=()=>new Date();async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pass};let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Помилка');return d}function toast(t){flash.textContent=t;flash.style.display='block';setTimeout(()=>flash.style.display='none',1800)}async function login(){pass=password.value;try{await api('/api/clients');sessionStorage.setItem('solo_pass',pass);openCRM()}catch(e){loginMsg.innerHTML='<div class=notice>'+esc(e.message)+'</div>'}}function logout(){sessionStorage.removeItem('solo_pass');location.reload()}async function openCRM(){loginBox.classList.add('hidden');main.classList.remove('hidden');logoutBtn.classList.remove('hidden');await load()}async function load(){let d=await api('/api/clients');clients=d.clients||[];fillFilters();render()}function fillFilters(){statusFilter.innerHTML='<option value="">Усі етапи</option>'+Object.entries(stages).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');sourceFilter.innerHTML='<option value="">Усі джерела</option>'+[...new Set(clients.map(c=>c.source).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('');form.status.innerHTML=Object.entries(stages).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}function isClosed(c){return ['deal','lost'].includes(c.status)}function isDue(c){return !!c.next_contact&&!isClosed(c)&&new Date(c.next_contact)<=now()}function startOfDay(d){let x=new Date(d);x.setHours(0,0,0,0);return x}function endOfDay(d){let x=new Date(d);x.setHours(23,59,59,999);return x}function sameDay(a,b){return startOfDay(a).getTime()===startOfDay(b).getTime()}function inDateFilter(c){if(!c.created_at)return dateFilter.value==='all';let d=new Date(c.created_at),mode=dateFilter.value,t=new Date();if(mode==='all')return true;if(mode==='today')return sameDay(d,t);if(mode==='yesterday'){let y=new Date(t);y.setDate(y.getDate()-1);return sameDay(d,y)}if(mode==='7d'){let from=startOfDay(t);from.setDate(from.getDate()-6);return d>=from&&d<=endOfDay(t)}if(mode==='30d'){let from=startOfDay(t);from.setDate(from.getDate()-29);return d>=from&&d<=endOfDay(t)}if(mode==='custom'&&customDate.value){let x=new Date(customDate.value+'T00:00:00');return sameDay(d,x)}return true}function dateChanged(){customDate.classList.toggle('hidden',dateFilter.value!=='custom');document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b.dataset.day===dateFilter.value));render()}function quickDay(v,btn){dateFilter.value=v;customDate.classList.add('hidden');document.querySelectorAll('[data-day]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}function fmtDate(v){if(!v)return'Не заплановано';let d=new Date(v);return d.toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}function fmtCreated(v){if(!v)return'Дата невідома';let d=new Date(v);return d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric'})}function render(){sTotal.textContent=clients.length;sNew.textContent=clients.filter(c=>c.status==='new').length;sActive.textContent=clients.filter(c=>!isClosed(c)&&c.status!=='new').length;sDue.textContent=clients.filter(isDue).length;sDeals.textContent=clients.filter(c=>c.status==='deal').length;let q=search.value.toLowerCase(),sf=statusFilter.value,src=sourceFilter.value;let a=clients.filter(c=>(!sf||c.status===sf)&&(!src||c.source===src)&&inDateFilter(c)&&(!dueOnly||isDue(c))&&(`${c.name} ${c.contact} ${c.car_name} ${c.notes}`).toLowerCase().includes(q));a.sort((x,y)=>Number(isDue(y))-Number(isDue(x))||new Date(y.created_at||0)-new Date(x.created_at||0));shown.textContent=`Показано: ${a.length}`;list.innerHTML=a.length?a.map(c=>`<div class="client ${isDue(c)?'overdue':''}"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.contact)} · ${esc(c.source||'—')}<br>${c.car_name?'🚘 '+esc(c.car_name):'Авто ще не вибрано'}${c.budget?' · '+esc(c.budget):''}</div><div class="created">📥 ${fmtCreated(c.created_at)}</div></div><div><span class="tag">${stages[c.status]||'Новий'}</span><div class="meta">${esc(c.payment_type||'')}</div></div><div class="due ${isDue(c)?'bad':'good'}">${isDue(c)?'⚠️ ':'📅 '}${fmtDate(c.next_contact)}</div><div class="actions"><button class="secondary" onclick="editClient('${c.id}')">Відкрити</button></div></div>`).join(''):'<div class="empty">За цим фільтром клієнтів немає.</div>'}function showDue(){dueOnly=!dueOnly;dueBtn.classList.toggle('active',dueOnly);render();toast(dueOnly?'Показую тих, кому треба написати/подзвонити':'Фільтр контактів вимкнено')}function newClient(){editingId='';form.reset();form.id.value='';form.source.value='TikTok';form.status.value='new';deleteBtn.classList.add('hidden');formTitle.textContent='Новий клієнт';history.innerHTML='';modal.classList.add('open')}function editClient(id){let c=clients.find(x=>x.id===id);if(!c)return;editingId=id;for(let k of ['id','name','contact','source','status','payment_type','car_name','budget','first_payment','notes'])if(form.elements[k])form.elements[k].value=c[k]??'';form.next_contact.value=c.next_contact?String(c.next_contact).slice(0,16):'';deleteBtn.classList.remove('hidden');formTitle.textContent='Картка клієнта';history.innerHTML=(c.history||[]).slice().reverse().map(h=>`<div class="history-item"><b>${fmtDate(h.at)}</b> · ${esc(h.text||h.type||'Подія')}</div>`).join('');modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}form.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form).entries()),ts=new Date().toISOString(),i=clients.findIndex(c=>c.id===d.id),old=i>=0?clients[i]:null,c={...(old||{}),id:d.id||crypto.randomUUID(),name:d.name.trim(),contact:d.contact.trim(),source:d.source,status:d.status,payment_type:d.payment_type,car_name:d.car_name.trim(),budget:d.budget.trim(),first_payment:d.first_payment.trim(),next_contact:d.next_contact?new Date(d.next_contact).toISOString():'',notes:d.notes.trim(),created_at:old?.created_at||ts,updated_at:ts};let changes=[];if(!old)changes.push({at:ts,type:'created',text:'Клієнта додано вручну'});else if(old.status!==c.status)changes.push({at:ts,type:'status',text:`Етап: ${stages[old.status]||old.status} → ${stages[c.status]||c.status}`});if(d.next_contact&&old?.next_contact!==c.next_contact)changes.push({at:ts,type:'reminder',text:'Заплановано наступний контакт'});c.history=[...(old?.history||[]),...changes].slice(-60);if(i>=0)clients[i]=c;else clients.unshift(c);try{await save();closeModal();render();toast('Збережено ✅')}catch(e){alert(e.message);await load()}};async function save(){await api('/api/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clients})})}async function deleteClient(){if(!editingId||!confirm('Видалити клієнта?'))return;clients=clients.filter(c=>c.id!==editingId);try{await save();closeModal();render();toast('Клієнта видалено')}catch(e){alert(e.message);await load()}}if(pass)openCRM();</script></body></html>

<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoloDealer Admin</title><style>:root{--bg:#050505;--panel:#0d0d10;--line:#292932;--grad:linear-gradient(110deg,#8c42df,#bd5acd 48%,#ff8b90);--text:#f7f7f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}button,input,textarea{font:inherit}.top{padding:18px 0;border-bottom:1px solid #222}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.brand b{background:var(--grad);-webkit-background-clip:text;color:transparent}.primary,.secondary,.danger{padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer}.primary{border:0;background:var(--grad);color:#fff}.secondary{border:1px solid #333;background:#111;color:#fff}.danger{border:1px solid #5b2c35;background:#1a0e11;color:#ffc0c8}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.login{width:min(450px,calc(100% - 28px));margin:70px auto}.field{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e0e12;color:#ddd}.stack{display:grid;gap:10px}.hidden{display:none!important}.admin{padding:35px 0}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.notice{padding:12px 14px;border:1px solid #3b2e46;border-radius:12px;color:#cab9d4;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:16px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:10px}.item{border:1px solid #292932;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:#888;display:block;margin-top:5px}.acts{display:flex;gap:7px}.acts button{padding:8px 10px;font-size:12px}.hint{font-size:12px;color:#777}@media(max-width:850px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap"><div class="brand"><b>SOLO</b>Dealer Admin</div><a class="secondary" href="/">Відкрити сайт</a></div></div><div id="loginBox" class="login panel"><h2>Вхід в адмінку</h2><div class="stack"><input id="password" class="field" type="password" placeholder="Пароль"><button class="primary" onclick="login()">Увійти</button><div id="loginMsg"></div></div></div><main id="main" class="admin hidden"><div class="wrap"><div class="bar"><h1>Керування каталогом</h1><button class="secondary" onclick="logout()">Вийти</button></div><div id="notice" class="notice"></div><div class="grid"><section class="panel"><h2 id="ft">Додати авто</h2><form id="f" class="stack"><input type="hidden" name="id"><input class="field" name="name" required placeholder="Повна назва"><div class="row2"><input class="field" name="brand" placeholder="Марка"><input class="field" name="model" placeholder="Модель"></div><div class="row2"><input class="field" name="year" type="number" placeholder="Рік"><input class="field" name="price" type="number" placeholder="Ціна, $"></div><input class="field" name="first_payment" type="number" placeholder="Перший внесок, $"><div class="row2"><input class="field" name="mileage" type="number" placeholder="Пробіг"><input class="field" name="engine" placeholder="Двигун"></div><div class="row2"><input class="field" name="body" placeholder="Кузов"><input class="field" name="fuel" placeholder="Тип двигуна"></div><div class="row2"><input class="field" name="drive" placeholder="Привід"><input class="field" name="range_km" type="number" placeholder="Запас ходу, км"></div><div class="row2"><input class="field" name="battery" placeholder="Батарея"><input class="field" name="trim" placeholder="Комплектація"></div><textarea class="field" name="description" placeholder="Опис"></textarea><textarea class="field" name="images" placeholder="Фото — URL по одному з нового рядка"></textarea><label class="field" style="text-align:center;cursor:pointer;font-weight:800">📷 Додати фото<input id="photos" type="file" accept="image/*" multiple style="display:none"></label><div id="up"></div><label><input type="checkbox" name="featured"> Рекомендуємо</label><label><input type="checkbox" name="published" checked> Опубліковано</label><div><button class="primary">Зберегти</button> <button class="secondary" type="button" onclick="clearF()">Очистити</button></div></form></section><section class="panel"><h2>Автомобілі</h2><div id="list" class="list"></div></section></div></div></main><script>let cars=[],pass=sessionStorage.getItem('solo_pass')||'',form=f;async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pass};let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Помилка');return d}async function login(){pass=password.value;try{await api('/api/catalog?admin=1');sessionStorage.setItem('solo_pass',pass);loginBox.classList.add('hidden');main.classList.remove('hidden');load()}catch(e){loginMsg.innerHTML='<div class=notice>'+e.message+'</div>'}}function logout(){sessionStorage.removeItem('solo_pass');location.reload()}async function load(){let d=await api('/api/catalog?admin=1');cars=d.cars;notice.textContent=d.storage?'✅ Сховище підключено. Зміни одразу видно всім.':'⚠️ Для збереження змін підключи Vercel Blob.';render()}function render(){list.innerHTML=cars.map(c=>`<div class=item><div><b>${c.name}</b><small>${c.year||''} · $${Number(c.price||0).toLocaleString('en-US')} · ${c.published===false?'Приховано':'Опубліковано'}</small></div><div class=acts><button class=secondary onclick="edit('${c.id}')">Редагувати</button><button class=danger onclick="del('${c.id}')">Видалити</button></div></div>`).join('')}function getCar(){let d=Object.fromEntries(new FormData(form).entries());return{id:d.id||crypto.randomUUID(),name:d.name,brand:d.brand,model:d.model,year:+d.year||null,price:+d.price||0,first_payment:+d.first_payment||null,mileage:+d.mileage||0,engine:d.engine,body:d.body,fuel:d.fuel,drive:d.drive,range_km:+d.range_km||null,battery:d.battery,trim:d.trim,description:d.description,images:(d.images||'').split('\n').map(x=>x.trim()).filter(Boolean),featured:form.featured.checked,published:form.published.checked}}form.onsubmit=async e=>{e.preventDefault();let c=getCar(),i=cars.findIndex(x=>x.id===c.id);if(i>=0)cars[i]=c;else cars.unshift(c);try{await api('/api/catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cars})});await load();clearF();alert('Збережено ✅')}catch(e){alert(e.message);await load()}};function edit(id){let c=cars.find(x=>x.id===id);for(let k of ['id','name','brand','model','year','price','first_payment','mileage','engine','body','fuel','drive','range_km','battery','trim','description'])if(form.elements[k])form.elements[k].value=c[k]??'';form.images.value=(c.images||[]).join('\n');form.featured.checked=!!c.featured;form.published.checked=c.published!==false;ft.textContent='Редагувати авто';scrollTo({top:0,behavior:'smooth'})}async function del(id){if(!confirm('Видалити авто?'))return;let next=cars.filter(x=>x.id!==id);try{await api('/api/catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cars:next})});load()}catch(e){alert(e.message)}}function clearF(){form.reset();form.published.checked=true;form.id.value='';ft.textContent='Додати авто'}async function compress(file){return new Promise((res,rej)=>{let im=new Image,fr=new FileReader;fr.onload=()=>im.src=fr.result;fr.onerror=rej;im.onload=()=>{let s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{let r=new FileReader;r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(b)},'image/jpeg',.82)};fr.readAsDataURL(file)})}photos.onchange=async e=>{up.innerHTML='<div class=notice>Завантажуємо…</div>';let urls=[];for(let file of e.target.files){try{let base64=await compress(file),d=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name+'.jpg',base64})});urls.push(d.url)}catch(e){alert(e.message)}}form.images.value=[form.images.value,...urls].filter(Boolean).join('\n');up.innerHTML='<div class=notice>✅ Завантажено: '+urls.length+'</div>'};if(pass){loginBox.classList.add('hidden');main.classList.remove('hidden');load()}</script></body></html>
